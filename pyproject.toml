[project]
name = "image-toolkit"
version = "0.1.0"
description = "Consolidated image/video toolkit CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.5",
  "rich>=13.9.2",
  "pillow>=10.4.0",
  "pillow-heif>=0.18.0",
  "imageio-ffmpeg>=0.5.1",
  "ultralytics>=8.3.40",
]

[project.optional-dependencies]
upscale = [
  "realesrgan-ncnn-py>=0.2.5",
]

[project.scripts]
itk = "image_toolkit.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ty>=0.0.84",
]

[tool.hatch.build.targets.wheel]
packages = ["src/image_toolkit"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["build", "dist", ".venv"]

[tool.ty.src]
include = ["src"]
exclude = ["build", "dist", ".venv"]

[tool.ty.environment]
extra-paths = []
